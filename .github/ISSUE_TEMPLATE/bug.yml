name: Bug Report
description: File a defect report or false positive/negative in drift detection
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide detailed reproduction steps, language details, and minimal code/doc fixtures.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the unexpected behavior is.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which subsystem is affected?
      options:
        - "Core AST Extractor (/packages/core)"
        - "Reconciler Engine (/packages/reconciler)"
        - "GitHub Action (/action)"
        - "Dashboard (/dashboard)"
        - "Benchmarks (/benchmarks)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code & Doc Snippet
      description: Provide the minimal code and markdown snippet that reproduces the issue.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
